name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  UPX_VERSION: "5.2.0"

jobs:
  build-linux:
    name: build (linux / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            upx_pkg: upx-5.2.0-amd64_linux
            upx_sha256: 3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            upx_pkg: upx-5.2.0-arm64_linux
            upx_sha256: 55d48a61e8ffd17152db871c855376cba7f08e830b37799d0947a16dff8ec36c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Build
        run: cargo build --profile release --locked --target ${{ matrix.target }}
      - name: Compress with UPX
        run: |
          wget -qO upx.tar.xz "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/${{ matrix.upx_pkg }}.tar.xz"
          echo "${{ matrix.upx_sha256 }}  upx.tar.xz" | sha256sum --check --strict --status
          tar -xf upx.tar.xz
          ./${{ matrix.upx_pkg }}/upx --lzma "target/${{ matrix.target }}/release/gar"
      - name: Rename
        run: cp target/${{ matrix.target }}/release/gar gar-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gar-linux-${{ matrix.arch }}
          path: gar-linux-${{ matrix.arch }}

  build-macos:
    name: build (macos / aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-macos-aarch64
      - name: Build
        run: cargo build --profile release --locked --target aarch64-apple-darwin
      - name: Rename
        run: cp target/aarch64-apple-darwin/release/gar gar-macos-aarch64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gar-macos-aarch64
          path: gar-macos-aarch64

  build-windows:
    name: build (windows / ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            upx: true
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            upx: false
    env:
      UPX_SHA256: b471ebf1b7f20f4a89150264ed9a008a2a5bfd247f3c6d1184a75bb59ca08f5d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Ensure Rust target
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: rustup target add "$RUST_TARGET"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Build
        run: cargo build --profile release --locked --target ${{ matrix.target }}
      - name: Compress with UPX
        if: matrix.upx
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile upx.zip "https://github.com/upx/upx/releases/download/v${{ env.UPX_VERSION }}/upx-${{ env.UPX_VERSION }}-win64.zip"
          $actual = (Get-FileHash upx.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:UPX_SHA256) { throw "UPX checksum mismatch: expected $env:UPX_SHA256, got $actual" }
          Expand-Archive -DestinationPath upx upx.zip
          upx/upx-${{ env.UPX_VERSION }}-win64/upx.exe --lzma "target/${{ matrix.target }}/release/gar.exe"
      - name: Rename
        shell: pwsh
        run: cp target/${{ matrix.target }}/release/gar.exe gar-windows-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gar-windows-${{ matrix.arch }}.exe
          path: gar-windows-${{ matrix.arch }}.exe

  release:
    name: release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            artifacts/*
