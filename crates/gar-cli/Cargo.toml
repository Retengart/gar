[package]
name = "gar"
description = "View binary data as Sumero-Babylonian base-60 digit pairs."
keywords = ["hexdump", "sexagesimal", "gar", "binary", "viewer"]
categories = ["command-line-utilities", "visualization"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme.workspace = true

[lib]
name = "gar"
path = "src/lib.rs"

[[bin]]
name = "gar"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.3", features = ["derive"] }
clap_complete = "4.6.7"
crossterm = "0.29.0"
memchr = "2.8.3"
memmap2 = "0.9.11"
ratatui = "0.30.2"
gar-core = { version = "0.1.0", path = "../gar-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
gar-core = { version = "0.1.0", path = "../gar-core" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports"] }
predicates = "3.1.4"
serial_test = { version = "3.5.0", default-features = false }
tempfile = "3.27.0"

[[bench]]
name    = "dump"
harness = false

[[bench]]
name    = "decode"
harness = false

[[bench]]
name    = "search"
harness = false

[lints]
workspace = true
